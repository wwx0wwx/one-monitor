name: ci-agent

# The agent is self-contained under agent/; only its own changes can break it.
on:
  push:
    branches: [main]
    paths: ["agent/**"]
  pull_request:
    paths: ["agent/**"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hanging test would otherwise consume the six-hour default; the suite
    # runs in well under a second.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
