name: ci-agent

# The agent is self-contained under agent/; only its own changes can break it.
on:
  push:
    branches: [main]
    paths: ["agent/**"]
  pull_request:
    paths: ["agent/**"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-agent-${{ github.ref }}
  cancel-in-progress: true

# The least these jobs need: they only read the checkout and publish nothing.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A hanging test would otherwise consume the six-hour default; the suite
    # runs in well under a second.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
