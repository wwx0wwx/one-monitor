name: ci-theme

# Every theme under themes/ is a complete standalone package; one loop builds
# whichever exist, so a new theme needs no workflow change -- only a directory.
on:
  push:
    branches: [main]
    paths: ["themes/**"]
  pull_request:
    paths: ["themes/**"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-theme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hub embeds a released archive, never this repository's source:
  # release-theme.yml builds a tag here and publishes theme.tar.gz, while the
  # hub's web-theme.pin names the tag and its sha256. A break on main therefore
  # cannot break a hub build, but this is the only gate a tag receives, since
  # by the time the hub sees it the build has already happened here. Shipping
  # to a hub is two steps: tag here, then move that pin there.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: themes/*/package-lock.json
      # One shell loop in place of a matrix: the themes that exist are what
      # runs, and a failing one fails the job naming its directory.
      - run: |
          for pkg in themes/*/package.json; do
            dir="$(dirname "$pkg")"
            echo "::group::$dir"
            (cd "$dir" && npm ci && npm run lint && npm test && npm run build)
            echo "::endgroup::"
          done
