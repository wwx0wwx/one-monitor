name: release-hub

# vX.Y.Z is the hub's lane in this repository's release list; the agent's
# codenames and the themes' theme-<short>- tags each have their own workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The narrower of the two grants: this job only compiles and uploads
    # artifacts, and the release below keeps the tag-push write it needs. A
    # compromised build step (a dependency, an action) holds a read-only token
    # rather than one that can rewrite releases.
    permissions:
      contents: read
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # The default theme arrives as a published archive, verified against the
      # hash in web-theme.pin. Run on the runner rather than left to build.rs,
      # because the cross container below does not necessarily carry curl; it
      # finds the theme already unpacked.
      - run: ./scripts/theme.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 24
          cache: npm
          # Relative to the repository root, not to the defaults above.
          cache-dependency-path: hub/web-admin/package-lock.json

      # The hub embeds the panel, so its dist/ must exist before cargo runs.
      - run: npm ci && npm run build
        working-directory: hub/web-admin

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo install --locked --version 0.2.5 cross
      - run: cross build --release --locked --target ${{ matrix.target }}

      # collect from target/ (the defaults keep this step in hub/) to the
      # repository root, where the artifact upload and the release job expect
      # the bare asset names.
      - run: cp "target/${{ matrix.target }}/release/monitor-hub" "../monitor-hub-${{ matrix.target }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ${{ matrix.target }}
          path: monitor-hub-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # The Dockerfile lives in the repo; the binaries it copies do not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          path: bin
          merge-multiple: true
      # A manual dispatch builds and collects the binaries; only a tag publishes,
      # so the path can be exercised without cutting a release. gh ships on the
      # runner, keeping a third-party action out of the contents:write step.
      #
      # sha256sums.txt is generated from inside bin/ so the names in it are bare
      # asset names, which is what install-hub.sh matches before installing the
      # binary into /opt/monitor.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          (cd bin && sha256sum monitor-hub-* > sha256sums.txt)
          gh release create "$GITHUB_REF_NAME" bin/monitor-hub-* bin/sha256sums.txt \
            --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      # The image carries the binary this release already published, so the two
      # cannot disagree on what a given tag contains. docker and buildx ship on
      # the runner, for the same reason gh does above.
      #
      # Both registries receive the same manifest from one build: Docker Hub is
      # where `docker run monitor` looks first, ghcr is what the repository
      # publishes alongside its binaries. A checkout without the Docker Hub
      # secrets still gets its ghcr image rather than a failed release.
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp bin/monitor-hub-x86_64-unknown-linux-musl hub/monitor-hub-amd64
          cp bin/monitor-hub-aarch64-unknown-linux-musl hub/monitor-hub-arm64
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="-t $IMAGE:$VERSION -t $IMAGE:latest"
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            # Same repository name as on GitHub, under the account the token belongs to.
            HUB="docker.io/$DOCKERHUB_USERNAME/${GITHUB_REPOSITORY##*/}"
            TAGS="$TAGS -t $HUB:$VERSION -t $HUB:latest"
          else
            echo "no Docker Hub credentials configured; publishing to ghcr only"
          fi
          # The default builder cannot produce two platforms in one manifest.
          # The build context is hub/, where the Dockerfile and the binaries
          # above now sit.
          docker buildx create --use --driver docker-container
          docker buildx build --platform linux/amd64,linux/arm64 --push $TAGS hub
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The digests of what this release published, committed back into
  # install-hub.sh on main. The installer then verifies its default download
  # against a value that travelled by git rather than by the release it names,
  # so swapping a release asset no longer passes the way swapping
  # sha256sums.txt beside it would. Warns rather than fails: a protected main
  # or a missing permission degrades the installer to the sums-file check it
  # always had, it does not take the release down with it.
  pin:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          path: bin
          merge-multiple: true
      - run: |
          set -eu
          amd64="$(sha256sum bin/monitor-hub-x86_64-unknown-linux-musl | cut -d' ' -f1)"
          arm64="$(sha256sum bin/monitor-hub-aarch64-unknown-linux-musl | cut -d' ' -f1)"
          sed -i "s|^PIN_amd64=.*|PIN_amd64="$amd64"|" hub/install-hub.sh
          sed -i "s|^PIN_arm64=.*|PIN_arm64="$arm64"|" hub/install-hub.sh
          git config user.name "release-bot"
          git config user.email "noreply@github.com"
          git add hub/install-hub.sh
          # Empty commit is fine on a re-run; the hashes it would write are
          # already there. [skip ci] keeps ci-hub from re-running on main.
          git commit -m "pin: install-hub.sh digests for $GITHUB_REF_NAME [skip ci]" || exit 0
          git push
