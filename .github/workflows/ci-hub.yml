name: ci-hub

# The hub builds from hub/ alone; nothing outside it reaches the binary. A
# change elsewhere in the monorepo therefore has nothing to check here.
on:
  push:
    branches: [main]
    paths: ["hub/**"]
  pull_request:
    paths: ["hub/**"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-hub-${{ github.ref }}
  cancel-in-progress: true

# The least these jobs need: they only read the checkout and publish nothing.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A hanging test would otherwise consume the six-hour default; a cold build
    # plus the suite takes a few minutes.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # The default theme arrives as a published archive, verified against the
      # hash in web-theme.pin. Run here rather than left to build.rs so the
      # download happens on the runner: release builds go through cross, whose
      # container does not necessarily carry curl.
      - run: ./scripts/theme.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 24
          cache: npm
          # Relative to the repository root, not to the defaults above.
          cache-dependency-path: hub/web-admin/package-lock.json

      # rust-embed requires the panel's dist/ to exist before cargo runs.
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: hub/web-admin

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
